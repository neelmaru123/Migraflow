[tool.poetry]
name = "migraflow-api"
version = "0.1.0"
description = "Migraflow - AI-assisted Data Migration Platform Backend API and Engine"
authors = ["Migraflow Architect <architect@migraflow.com>"]
readme = "README.md"
packages = [
    { include = "app" }
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
sqlalchemy = "^2.0.35"
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.9"
polars = "^1.8.0"
duckdb = "^1.1.0"
pyarrow = "^18.0.0"
openpyxl = "^3.1.5"
alembic = "^1.13.0"
redis = "^5.0.8"
rq = "^1.16.2"
google-generativeai = "^0.8.0"
langchain-core = "^0.3.0"
langchain-google-genai = "^2.0.0"
langchain-openai = "^0.2.0"
pyjwt = "^2.13.0"
bcrypt = "^5.0.0"
motor = "^3.7.0"
pymongo = "^4.17.0"
aiomysql = "^0.2.0"
pymysql = "^1.2.0"
python-multipart = "^0.0.9"
email-validator = "^2.3.0"
google-auth = "^2.56.3"
langgraph = "^0.2.0"
langgraph-checkpoint-postgres = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
aiosqlite = "^0.20.0"
httpx = "^0.27.2"
ruff = "^0.6.5"
mypy = "^1.11.2"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]
