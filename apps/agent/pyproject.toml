[tool.poetry]
name = "data-migration-platform-agent"
version = "0.1.0"
description = "Docker Agent Application Runtime for Customer Database Migration"
authors = ["Lead Architect <architect@migrationplatform.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.9.0"
sqlalchemy = "^2.0.35"
psycopg2-binary = "^2.9.9"
pymysql = "^1.1.1"
polars = "^1.0.0"
duckdb = "^1.1.0"
pyarrow = "^18.0.0"
pymongo = "^4.6.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
